[package]
name = "central"
description = "Main central CLI — serve, run submit, node decide, checkpoint *, artifact read, local *, migrate *, backup *, restore *, helper/broker/sandbox-launcher modes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
central-foundation = { path = "../../crates/central-foundation", version = "0.1.0" }
central-kernel = { path = "../../crates/central-kernel", version = "0.1.0" }
# `central artifact read` (Phase R4, spec-5 §5/§7): the capability owns
# the read-authorization and edge-journaling domain; the binary composes
# the two adapters behind it exactly as upstream's
# `cmd/central/artifact_read_composition.go` does.
central-artifact = { path = "../../crates/capabilities/central-artifact", version = "0.1.0" }
# `central checkpoint *` (Phase R4 task 8, issue #94 slice 2C): the
# capability owns the resume-checkpoint domain and orchestration ports;
# the binary composes the PostgreSQL store + filesystem digester exactly
# as upstream's `cmd/central/checkpoint_composition.go` does.
central-checkpoint = { path = "../../crates/capabilities/central-checkpoint", version = "0.1.0" }
# `central node decide` (Phase R4 task 9, issue #95 slice 2D): the
# capability owns the ambiguous-decision vocabulary and the workflow
# store seam; the binary composes the PostgreSQL workflow store
# exactly as upstream's `cmd/central/node_composition.go` does.
central-workflow = { path = "../../crates/capabilities/central-workflow", version = "0.1.0" }
# `central serve` + `harness resume|rerun|cancel` (Phase R3 task 13):
# the verbs compose the execution/task/harness stores and the same
# kernel operator the web surface runs — no second authority.
central-execution = { path = "../../crates/capabilities/central-execution", version = "0.1.0" }
central-task = { path = "../../crates/capabilities/central-task", version = "0.1.0" }
# `central run submit` (Phase R4 task 10, issue #122): the verb
# composes the shared runsubmit saga over CENTRAL_NODE_DSN exactly
# like `node decide` — one domain path for CLI and HTTP.
central-runsubmit = { path = "../../crates/capabilities/central-runsubmit", version = "0.1.0" }
central-harness = { path = "../../crates/capabilities/central-harness", version = "0.1.0" }
central-transport-http = { path = "../../crates/transport/central-transport-http", version = "0.1.0" }
central-adapter-postgres = { path = "../../crates/adapters/central-adapter-postgres", version = "0.1.0" }
central-adapter-s3 = { path = "../../crates/adapters/central-adapter-s3", version = "0.1.0" }
# `central --helper` (Phase R5 task 8): upstream `cmd/central` imports
# `internal/adapter/authority/helper` directly — the bin composes the
# helper daemon the same way, over the workspace-pinned adapter the
# kernel already pulls in.
central-adapter-linux = { path = "../../crates/adapters/central-adapter-linux", version = "0.1.0" }
# `central --helper`/`--broker`/`--sandbox-launcher` mode gates (Phase
# R5 task 1): the privilege check needs `rustix::process::getuid` —
# the same pinned workspace dep the kernel and launcher bins already
# use.
rustix.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
# Phase-2 recovery test matrix (`tests/phase2_acceptance/`): composes the
# real scheduler/retry/eventjournal capability seams the `central` binary
# only reaches through `central-kernel`, so the test target names them
# directly.
central-scheduler = { path = "../../crates/capabilities/central-scheduler", version = "0.1.0" }
central-retry = { path = "../../crates/capabilities/central-retry", version = "0.1.0" }
central-eventjournal = { path = "../../crates/capabilities/central-eventjournal", version = "0.1.0" }
# Read projections (`attempts_for_run`, `outbox_health`, deferred
# admissions, checkpoints) the recovery matrix asserts on — the
# PostgreSQL reader is `central-adapter-postgres::runview`.
central-runview = { path = "../../crates/capabilities/central-runview", version = "0.1.0" }
serde.workspace = true
uuid.workspace = true

[[test]]
name = "phase2_acceptance"
path = "tests/phase2_acceptance/mod.rs"

[lints]
workspace = true
