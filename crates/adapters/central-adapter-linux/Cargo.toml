[package]
name = "central-adapter-linux"
description = "Linux platform adapter — protected-broker protocol, memfd, SCM_RIGHTS, SO_PEERCRED, openat2, pidfd, PAM/TTY, namespaces, cgroups"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
central-adapter-harness = { path = "../central-adapter-harness", version = "0.1.0" }
central-adapter-s3 = { path = "../central-adapter-s3", version = "0.1.0" }
central-artifact = { path = "../../capabilities/central-artifact", version = "0.1.0" }
central-backup = { path = "../../capabilities/central-backup", version = "0.1.0" }
central-foundation = { path = "../../central-foundation", version = "0.1.0" }
central-harness = { path = "../../capabilities/central-harness", version = "0.1.0" }
central-infra = { path = "../../capabilities/central-infra", version = "0.1.0" }
central-scheduler = { path = "../../capabilities/central-scheduler", version = "0.1.0" }
central-session = { path = "../../capabilities/central-session", version = "0.1.0" }
# `event` (pidfd liveness via `poll`, the TTY ceremony's bounded
# read/write), `thread` (`PR_SET_NO_NEW_PRIVS`, `PR_CAPBSET_*`,
# `unshare`/`setns`), `termios` (`TIOCEXCL`, `TCGETS`/`TCSETS` echo
# suppression, `TCFLSH` — the R5-task-5 PAM/TTY boundary), `pty`
# (the pty test fixture), and `rand` (`getrandom` for ceremony
# confirmation codes) are the `sys` boundary's extra API surface —
# the same additive-per-crate feature pattern
# `central-harness-launcherd` uses.
rustix = { workspace = true, features = ["event", "pty", "rand", "termios", "thread"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
# Broker-core additions (R5 task 6): `uuid`/`time` for the
# upstream-shaped identity and timestamp fields, `sha2`/`hmac` for the
# signed record digests and the `HMACFingerprint` vocabulary,
# `ed25519-dalek` for the journal's externally-verifiable signature,
# `rand` for the signer seed. All are already pinned in
# `[workspace.dependencies]` (plan §"Tech Stack").
uuid.workspace = true
time.workspace = true
sha2.workspace = true
hmac.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
# Broker custody additions (R5 task 7): `rcgen` mints the broker's
# Ed25519 TLS authority (upstream `tls_authority.go`); `x509-parser`
# re-validates the persisted CA/leaf chain on restart
# (`tls_persistent.go`'s `authorityFromState` checks). Both are pinned
# in `[workspace.dependencies]`.
rcgen.workspace = true
x509-parser.workspace = true
rustls-pki-types.workspace = true
# Portable-export additions (R6 task 12): `aes-gcm` is the bx1 bundle's
# authenticated cipher (upstream internal/portable/bundle.go —
# AES-256-GCM segment framing). Pinned exact in
# `[workspace.dependencies]` and consumed only here.
aes-gcm.workspace = true
# Dependency-prepare additions (R5 task 11): verified source-archive
# extraction and release-tar staging. `flate2` keeps its default
# `miniz_oxide` backend; both are pinned exact in
# `[workspace.dependencies]` and consumed only here — the
# `central-infra` domain owns the archive *policy* (paths, caps, types)
# but never an archive-format crate.
tar.workspace = true
flate2.workspace = true
# This crate is one of the two places audited `unsafe` may live
# (workflow §5.2): libc carries the one call site rustix has no safe
# wrapper for in `sys` — the `seccomp(2)` `SECCOMP_SET_MODE_FILTER`
# install (R5 decision D2). Every use sits inside `sys/` — the call
# site in `sys::audited`, the filter built in `sys::seccomp` from libc
# ABI types/constants — behind a named safe wrapper with a `// SAFETY:`
# proof, like the launcher binaries' `sys.rs`.
libc.workspace = true

# This crate is one of the two audited `unsafe` sites (workflow §5.2):
# `sys::audited` opts back in per module, so this crate lists the
# workspace lints by hand (it cannot both inherit and override
# `unsafe_code`) with `unsafe_code` at "deny" instead of "forbid".
# Every production `pub mod` in `lib.rs`/`sys/mod.rs` re-pins `forbid`,
# with the crate-level "deny" as the backstop — the same shape as
# `central-harness-launcherd`'s `sys.rs`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
