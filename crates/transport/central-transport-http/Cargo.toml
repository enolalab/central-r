[package]
name = "central-transport-http"
description = "HTTP transport — axum controllers: API v1 JSON, Askama SSR Web UI, Health & Metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
central-foundation = { path = "../../central-foundation", version = "0.1.0" }
central-artifact = { path = "../../capabilities/central-artifact", version = "0.1.0" }
central-checkpoint = { path = "../../capabilities/central-checkpoint", version = "0.1.0" }
central-eventjournal = { path = "../../capabilities/central-eventjournal", version = "0.1.0" }
central-execution = { path = "../../capabilities/central-execution", version = "0.1.0" }
central-runview = { path = "../../capabilities/central-runview", version = "0.1.0" }
central-scheduler = { path = "../../capabilities/central-scheduler", version = "0.1.0" }
central-session = { path = "../../capabilities/central-session", version = "0.1.0" }
central-task = { path = "../../capabilities/central-task", version = "0.1.0" }
central-runsubmit = { path = "../../capabilities/central-runsubmit", version = "0.1.0" }
central-workflow = { path = "../../capabilities/central-workflow", version = "0.1.0" }
askama.workspace = true
axum.workspace = true
# Application-listener TLS termination (R5 task 14 / B06): TLS 1.3-only
# rustls ServerConfig + the axum `Listener` adapter (`src/tls.rs`).
rustls = { workspace = true, features = ["ring"] }
tokio-rustls.workspace = true
prometheus-client.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "limit"] }
tracing.workspace = true
trait-variant.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
central-foundation = { path = "../../central-foundation", version = "0.1.0" }
central-session = { path = "../../capabilities/central-session", version = "0.1.0" }
central-runsubmit = { path = "../../capabilities/central-runsubmit", version = "0.1.0" }
central-workflow = { path = "../../capabilities/central-workflow", version = "0.1.0" }
rand.workspace = true
rcgen.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
