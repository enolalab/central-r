[package]
name = "central-kernel"
description = "Kernel — the single composition root: manual dependency wiring, supervised task runner, graceful shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
central-foundation = { path = "../central-foundation", version = "0.1.0" }
central-backup = { path = "../capabilities/central-backup", version = "0.1.0" }
central-artifact = { path = "../capabilities/central-artifact", version = "0.1.0" }
# The artifact-work fence (`ArtifactWorkClaim`/`RecoveryEpoch`) and the
# `RecoveryCoordinatorService` fence-source impl the reconciler
# component drives (rust-application-boundaries.md §2.2 kernel edge).
central-execution = { path = "../capabilities/central-execution", version = "0.1.0" }
central-harness = { path = "../capabilities/central-harness", version = "0.1.0" }
central-task = { path = "../capabilities/central-task", version = "0.1.0" }
# R4 task 10 (issue #122): the serve root composes the shared
# runsubmit saga over the runtime pool for `POST /app/runs/submit` —
# the same service the `central run submit` CLI composes.
central-runsubmit = { path = "../capabilities/central-runsubmit", version = "0.1.0" }
# R4 task 12 (issue #93/#94/#95): the serve root composes the Phase-2
# scheduler stack — worker/claim-loop/sweepers, retry timeout kills and
# compensation, checkpoint GC, and the event outbox publisher — behind
# CENTRAL_PHASE2_SCHEDULER.
central-scheduler = { path = "../capabilities/central-scheduler", version = "0.1.0" }
central-retry = { path = "../capabilities/central-retry", version = "0.1.0" }
central-checkpoint = { path = "../capabilities/central-checkpoint", version = "0.1.0" }
central-eventjournal = { path = "../capabilities/central-eventjournal", version = "0.1.0" }
central-adapter-harness = { path = "../adapters/central-adapter-harness", version = "0.1.0" }
central-adapter-linux = { path = "../adapters/central-adapter-linux", version = "0.1.0" }
central-adapter-postgres = { path = "../adapters/central-adapter-postgres", version = "0.1.0" }
# The serve root binds the B10 object store to the artifact capability
# (rust-application-boundaries.md §2.2 kernel edge).
central-adapter-s3 = { path = "../adapters/central-adapter-s3", version = "0.1.0" }
# The operator surface implements the transport's `web::HarnessOperator`
# port; the serve root also builds the app/ops routers (Task 13).
central-transport-http = { path = "../transport/central-transport-http", version = "0.1.0" }
# The dev-gated bootstrap returns the session capability's own typed
# contract (`central-session` is a capability peer, not an adapter).
central-session = { path = "../capabilities/central-session", version = "0.1.0" }
# Task 13 serve edge: the kernel opens the runtime pool, serves the
# axum routers it builds, reads the audited uid for the sealer, and
# owns the metrics registry the ops listener encodes.
axum.workspace = true
prometheus-client.workspace = true
rustix.workspace = true
# B06 serve TLS validation (`serve_tls`): the certificate/key parse
# and signature checks the application listener's material goes
# through before `central-transport-http::tls` builds the 1.3-only
# server config.
rustls.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
sqlx.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# `backup_compose` — `zeroize::Zeroizing` wipes the bounded passfile
# bytes the instant the runtime connection is built.
zeroize.workspace = true
tracing.workspace = true
# `migrate_compose` — operation/launch-evidence identities are
# `uuid::Uuid` (the migration operator's own wire vocabulary).
uuid.workspace = true

[dev-dependencies]
# Test-only CA/leaf minting for `serve_tls` and TLS-listener fixtures.
rcgen.workspace = true

[lints]
workspace = true
