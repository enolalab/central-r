<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central-Rust · Roadmap & Tiến độ R0–R6</title>
<!-- Generated by scripts/roadmap-dashboard.py — do not edit the HTML by hand; edit the template and re-run. -->
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --border: #2a3140;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --complete: #3fb950; --active: #d29922; --pending: #6e7681; --danger: #f85149;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: #262c36; padding: 1px 5px; border-radius: 4px; color: #c9d1d9; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { padding: 28px 32px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: -.3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { padding: 8px 32px 48px; display: grid; gap: 20px; max-width: 1480px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .v { font-size: 26px; font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .h { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { height: 8px; background: #262c36; border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--complete), #56d364); border-radius: 99px; transition: width .4s; }
  .bar.active > span { background: linear-gradient(90deg, var(--active), #e3b341); }

  /* Timeline */
  .timeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; position: relative; }
  .node { position: relative; text-align: center; cursor: pointer; padding: 6px 6px 10px; border-radius: 10px; }
  .node:hover { background: var(--panel2); }
  .node.sel { background: var(--panel2); outline: 1px solid var(--accent); }
  .node::before { content: ""; position: absolute; top: 40px; left: -50%; width: 100%; height: 3px; background: var(--border); z-index: 0; }
  .node:first-child::before { display: none; }
  .node.complete::before, .node.active::before { background: var(--complete); }
  .ring { position: relative; width: 70px; height: 70px; margin: 5px auto 8px; z-index: 1; }
  .ring svg { transform: rotate(-90deg); }
  .ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .ring .lbl small { display: block; font-size: 10px; color: var(--muted); font-weight: 500; margin-top: -4px; }
  .node .t { font-size: 12.5px; line-height: 1.35; color: var(--text); min-height: 50px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .4px; margin-top: 6px; }
  .badge.complete { background: rgba(63,185,80,.15); color: var(--complete); }
  .badge.active { background: rgba(210,153,34,.18); color: var(--active); }
  .badge.pending { background: rgba(110,118,129,.18); color: #9da5ae; }
  .pulse { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 0 rgba(210,153,34,0)); } 50% { filter: drop-shadow(0 0 8px rgba(210,153,34,.7)); } }

  /* Detail */
  .detail { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 1000px) { .detail { grid-template-columns: 1fr; } .timeline { grid-template-columns: repeat(4, 1fr); row-gap: 14px; } .node::before { display: none; } }
  .dhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .dhead h3 { margin: 0; font-size: 19px; }
  .goal { color: var(--muted); font-size: 13px; margin: 6px 0 14px; max-height: 4.6em; overflow: hidden; position: relative; cursor: pointer; }
  .goal.open { max-height: none; }
  .task { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--panel2); }
  .task > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 26px 1fr 110px; gap: 10px; align-items: center; }
  .task > summary::-webkit-details-marker { display: none; }
  .task .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .task.done .ic { background: var(--complete); color: #0d1117; }
  .task.doing .ic { background: var(--active); color: #0d1117; }
  .task.todo .ic { border: 2px solid var(--pending); color: var(--muted); }
  .task .tt { font-size: 13.5px; }
  .task .tp { font-size: 12px; color: var(--muted); text-align: right; }
  .task .tp .bar { margin-top: 4px; height: 5px; }
  .steps { margin: 0; padding: 0 14px 12px 48px; list-style: none; }
  .steps li { padding: 3px 0; font-size: 13px; display: flex; gap: 8px; color: var(--muted); }
  .steps li.ok { color: var(--text); }
  .steps li::before { content: "○"; color: var(--pending); flex: none; }
  .steps li.ok::before { content: "✓"; color: var(--complete); font-weight: 700; }
  .steps li.next { color: var(--active); }
  .steps li.next::before { content: "▶"; color: var(--active); }
  ul.acc { margin: 0; padding-left: 18px; } ul.acc li { margin: 4px 0; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12px ui-monospace, monospace; padding: 3px 8px; border-radius: 6px; background: #262c36; border: 1px solid var(--border); }
  .chip.impl { border-color: rgba(63,185,80,.5); color: #7ee787; }
  .chip.scaf { color: var(--muted); border-style: dashed; }
  .side h4 { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .side h4:first-child { margin-top: 0; }
  .next-box { border-left: 3px solid var(--active); background: rgba(210,153,34,.08); padding: 10px 12px; border-radius: 6px; font-size: 13px; }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }

  /* Crates & commits */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
  .crow { display: grid; grid-template-columns: 210px 40px 1fr 60px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
  .crow .n { font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .p { font-size: 11px; color: var(--muted); }
  .crow .lc { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .crow .bar > span { background: var(--accent); }
  .crow.scaf .bar > span { background: var(--pending); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .filters button.on { color: var(--text); border-color: var(--accent); }
  .commit { display: grid; grid-template-columns: 64px 84px 1fr; gap: 8px; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed #222936; }
  .commit .h { font-family: ui-monospace, monospace; color: var(--accent); }
  .commit .d { color: var(--muted); }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; margin-right: 6px; font-weight: 600; }
  .tag.feat { background: rgba(63,185,80,.15); color: var(--complete); }
  .tag.fix { background: rgba(248,81,73,.15); color: var(--danger); }
  .tag.docs { background: rgba(88,166,255,.15); color: var(--accent); }
  .tag.test, .tag.chore, .tag.other { background: rgba(110,118,129,.2); color: #9da5ae; }
  svg text { fill: var(--muted); font-size: 10px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Central-Rust · Roadmap & Tiến độ <span style="color:var(--muted)">R0 → R6</span></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--complete)"></i>Hoàn thành</span>
    <span><i style="background:var(--active)"></i>Đang làm</span>
    <span><i style="background:var(--pending)"></i>Chưa bắt đầu</span>
  </div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="panel"><h2>Lộ trình vertical slice (ADR 0043)</h2><div class="timeline" id="timeline"></div></section>
  <section class="detail">
    <div class="panel" id="detail-main"></div>
    <div class="panel side" id="detail-side"></div>
  </section>
  <section class="panel" id="post-panel"><h2>Slice sau R6</h2><div id="post"></div></section>
  <section class="two">
    <div class="panel"><h2>Crate · LOC Rust theo phase sở hữu</h2><div class="filters" id="crate-filters"></div><div id="crates"></div></div>
    <div class="panel"><h2>Hoạt động commit</h2><div id="activity"></div><div id="commits" style="margin-top:12px"></div></div>
  </section>
</main>
<footer id="foot"></footer>
<script>
const DATA = /*__DATA__*/null;
const STATUS_VI = { complete: "Hoàn thành", active: "Đang làm", pending: "Chưa bắt đầu" };
const COLOR = { complete: "var(--complete)", active: "var(--active)", pending: "var(--pending)" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const fileLink = (rel, label) => `<a href="file://${esc(DATA.root)}/${esc(rel)}">${esc(label || rel.split("/").pop())}</a>`;
const fmt = (n) => n.toLocaleString("vi-VN");

function ring(pct, status, size = 70) {
  const r = size / 2 - 6, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#262c36" stroke-width="6" fill="var(--bg)"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${COLOR[status]}" stroke-width="6" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function taskState(t) {
  const d = t.steps.filter((s) => s.done).length;
  return d === t.steps.length && d > 0 ? "done" : d > 0 ? "doing" : "todo";
}

function nextStep(p) {
  if (!p.plan || p.status === "complete") return null;
  for (const t of p.plan.tasks) for (const s of t.steps) if (!s.done) return { task: t, step: s };
  return null;
}

function renderKpis() {
  const ph = DATA.phases;
  const overall = ph.reduce((a, p) => a + p.percent, 0) / ph.length;
  const active = ph.find((p) => p.status === "active");
  const done = ph.filter((p) => p.status === "complete").length;
  const loc = DATA.crates.reduce((a, c) => a + c.loc, 0);
  const impl = DATA.crates.filter((c) => !c.scaffold).length;
  const days = new Set(DATA.commits.map((c) => c.date)).size;
  const cards = [
    { l: "Tổng tiến độ", v: overall.toFixed(1) + "%", h: `<div class="bar" style="margin-top:8px"><span style="width:${overall}%"></span></div>` },
    { l: "Phase hoàn thành", v: `${done}/${ph.length}`, h: ph.filter((p) => p.status === "complete").map((p) => p.id).join(" · ") || "—" },
    { l: "Phase đang làm", v: active ? active.id : "—", h: active ? `${active.steps_done}/${active.steps_total} step · ${active.percent}%` : "" },
    { l: "Crate đã hiện thực", v: `${impl}/${DATA.crates.length}`, h: `còn ${DATA.crates.length - impl} crate placeholder` },
    { l: "Dòng Rust", v: fmt(loc), h: "src/ + tests/ của mọi crate" },
    { l: "Commit", v: fmt(DATA.commits.length), h: `trong ${days} ngày làm việc` },
  ];
  $("kpis").innerHTML = cards.map((k) => `<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="h">${k.h}</div></div>`).join("");
}

let selected = null;
function renderTimeline() {
  $("timeline").innerHTML = DATA.phases.map((p) => `
    <div class="node ${p.status} ${selected === p.id ? "sel" : ""}" data-id="${p.id}" title="${esc(p.title)}">
      <div class="ring ${p.status === "active" ? "pulse" : ""}">${ring(p.percent, p.status)}
        <div class="lbl"><div>${p.id}<small>${Math.round(p.percent)}%</small></div></div></div>
      <div class="t">${md(p.title.replace(/\s*\(.*\)\s*$/, ""))}</div>
      <span class="badge ${p.status}">${STATUS_VI[p.status] || p.status}</span>
    </div>`).join("");
  document.querySelectorAll(".node").forEach((n) => n.addEventListener("click", () => select(n.dataset.id)));
}

function select(id) {
  selected = id;
  location.hash = id;
  renderTimeline();
  const p = DATA.phases.find((x) => x.id === id);
  const nxt = nextStep(p);
  let tasksHtml = `<div class="empty">Chưa có implementation plan cho ${p.id}. Tạo plan tại <code>docs/internal/superpowers/plans/</code> với tên chứa <code>phase-${p.id.toLowerCase()}</code>.</div>`;
  if (p.plan) {
    tasksHtml = p.plan.tasks.map((t) => {
      const st = taskState(t), d = t.steps.filter((s) => s.done).length, pct = t.steps.length ? (100 * d / t.steps.length) : 0;
      const open = st === "doing" || (nxt && nxt.task === t);
      return `<details class="task ${st}" ${open ? "open" : ""}>
        <summary><span class="ic">${st === "done" ? "✓" : t.n}</span><span class="tt">${md(t.title)}</span>
          <span class="tp">${d}/${t.steps.length} step<div class="bar ${st === "doing" ? "active" : ""}"><span style="width:${pct}%"></span></div></span></summary>
        <ul class="steps">${t.steps.map((s) => `<li class="${s.done ? "ok" : nxt && nxt.step === s ? "next" : ""}">${md(s.text)}</li>`).join("")}</ul>
      </details>`;
    }).join("");
  }
  $("detail-main").innerHTML = `
    <div class="dhead"><h3>${p.id} — ${md(p.title)}</h3><span class="badge ${p.status}">${STATUS_VI[p.status]}</span></div>
    <div class="bar ${p.status === "active" ? "active" : ""}"><span style="width:${p.percent}%"></span></div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">${p.percent}% · ${p.steps_done}/${p.steps_total} step trong plan${p.plan ? " · " + fileLink(p.plan.file) : ""}</div>
    ${p.plan && p.plan.goal ? `<div class="goal" title="Bấm để mở rộng" onclick="this.classList.toggle('open')">${md(p.plan.goal)}</div>` : ""}
    <h2 style="margin-top:14px">Task trong plan</h2>${tasksHtml}`;

  const crates = p.crates.map((n) => {
    const c = DATA.crates.find((x) => x.name === n);
    const cls = c ? (c.scaffold ? "scaf" : "impl") : "scaf";
    return `<span class="chip ${cls}" title="${c ? fmt(c.loc) + " dòng" : "chưa có crate"}">${esc(n)}${c && !c.scaffold ? " · " + fmt(c.loc) : ""}</span>`;
  }).join("") || '<span class="empty">Chỉ có tài liệu</span>';
  const reviews = DATA.reviews.filter((r) => r.phase === p.id);
  $("detail-side").innerHTML = `
    ${nxt ? `<h4>Bước tiếp theo</h4><div class="next-box"><b>Task ${nxt.task.n}:</b> ${md(nxt.task.title)}<br><span style="color:var(--muted)">${md(nxt.step.text)}</span></div>` : ""}
    <h4>Tiêu chí nghiệm thu (roadmap)</h4>
    ${p.acceptance.length ? `<ul class="acc">${p.acceptance.map((a) => `<li>${md(a)}</li>`).join("")}</ul>` : '<div class="empty">—</div>'}
    <h4>Migration authority</h4><div style="font-size:13px">${md(p.migrations || "—")}</div>
    <h4>Crate sở hữu</h4><div class="chips">${crates}</div>
    <h4>Review</h4>${reviews.length ? reviews.map((r) => `<div style="font-size:13px">${esc(r.date)} · ${fileLink(r.file, r.title)}</div>`).join("") : '<div class="empty">Chưa có review report</div>'}`;
}

let crateFilter = "all";
function renderCrates() {
  const ids = ["all", ...DATA.phases.map((p) => p.id), "placeholder"];
  $("crate-filters").innerHTML = ids.map((i) => `<button class="${crateFilter === i ? "on" : ""}" data-f="${i}">${i === "all" ? "Tất cả" : i === "placeholder" ? "Placeholder" : i}</button>`).join("");
  document.querySelectorAll("#crate-filters button").forEach((b) => b.addEventListener("click", () => { crateFilter = b.dataset.f; renderCrates(); }));
  const max = Math.max(...DATA.crates.map((c) => c.loc), 1);
  const list = DATA.crates.filter((c) => crateFilter === "all" || (crateFilter === "placeholder" ? c.scaffold : c.phase === crateFilter));
  $("crates").innerHTML = list.map((c) => `<div class="crow ${c.scaffold ? "scaf" : ""}">
      <span class="n" title="${esc(c.name)}">${esc(c.name)}</span><span class="p">${c.phase || "—"}</span>
      <div class="bar"><span style="width:${Math.max(1, 100 * c.loc / max)}%"></span></div><span class="lc">${fmt(c.loc)}</span></div>`).join("") || '<div class="empty">Không có crate</div>';
}

function renderCommits() {
  const byDay = {};
  for (const c of DATA.commits) byDay[c.date] = (byDay[c.date] || 0) + 1;
  const days = Object.keys(byDay).sort();
  if (days.length) {
    const max = Math.max(...Object.values(byDay)), W = 520, H = 120, bw = Math.min(46, (W - 20) / days.length - 6);
    const bars = days.map((d, i) => {
      const h = (H - 30) * byDay[d] / max, x = 10 + i * (bw + 6);
      return `<rect x="${x}" y="${H - 18 - h}" width="${bw}" height="${h}" rx="3" fill="var(--accent)"><title>${d}: ${byDay[d]} commit</title></rect>
        <text x="${x + bw / 2}" y="${H - 20 - h - 3}" text-anchor="middle">${byDay[d]}</text>
        <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${d.slice(5)}</text>`;
    }).join("");
    $("activity").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg>`;
  }
  $("commits").innerHTML = DATA.commits.slice(0, 18).map((c) => {
    const m = c.subject.match(/^(\w+)(\(([^)]+)\))?:\s*(.*)$/);
    const type = m ? m[1] : "other", scope = m && m[3] ? m[3] : "", rest = m ? m[4] : c.subject;
    const cls = ["feat", "fix", "docs", "test", "chore"].includes(type) ? type : "other";
    return `<div class="commit"><span class="h">${esc(c.hash)}</span><span class="d">${esc(c.date)}</span>
      <span><span class="tag ${cls}">${esc(type)}${scope ? "·" + esc(scope) : ""}</span>${md(rest)}</span></div>`;
  }).join("");
}

$("sub").innerHTML = `Sinh lúc ${esc(new Date(DATA.generated).toLocaleString("vi-VN"))} từ ${fileLink("docs/implementation/rust-vertical-slice-roadmap.md")}, ${fileLink("docs/implementation/current-phase.md")} và các plan trong <code>docs/internal/superpowers/plans/</code>`;
$("foot").innerHTML = `Cập nhật: tick <code>- [x]</code> trong plan / commit, rồi chạy <code>python3 scripts/roadmap-dashboard.py</code>`;
function renderPost() {
  $("post").innerHTML = (DATA.post || []).map((sl) => {
    const done = sl.tasks.filter((t) => t.done).length;
    return `<div><b>${esc(sl.title)}</b> — ${done}/${sl.tasks.length} task · ${fileLink(sl.file)}</div>` +
      sl.tasks.map((t) => `<div style="margin:4px 0 0 12px">${t.done ? "✅" : "⏳"} LC-T${t.n} ${esc(t.title)} <span style="color:var(--muted)">${t.commits.map(esc).join(", ")}</span></div>`).join("");
  }).join("") || "—";
}
renderKpis();
renderPost();
renderCrates();
renderCommits();
const initial = location.hash.slice(1);
select(DATA.phases.some((p) => p.id === initial) ? initial : (DATA.phases.find((p) => p.status === "active") || DATA.phases[0]).id);
</script>
</body>
</html>
