# cargo-deny policy — rust-engineering-workflow.md §6.
#
# Four enforced checks: licenses, sources, RustSec advisories, bans/duplicates.
# This file is reviewed like code.

[graph]
all-features = true

# --- 1. Licenses -------------------------------------------------------------
# Allowlist: MIT, Apache-2.0, BSD-3-Clause. SPDX `OR` expressions such as
# `MIT OR Apache-2.0` are satisfied because both terms are allowed.
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]
confidence-threshold = 0.8
# Every member crate is `publish = false`; workspace crates carry the
# workspace license anyway, this only guards a missed declaration.
private = { ignore = true }
# Recorded exceptions (workflow §6 "an accepted, recorded exception").
# `unicode-ident` is an unavoidable transitive dependency
# (serde_derive -> syn -> proc-macro2) and carries Unicode-3.0, an
# OSI-approved permissive license outside the allowlist. Scope is pinned
# to this crate only; no version bound because every released
# unicode-ident >= 1.0.19 carries the same license.
exceptions = [
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    # Recorded exceptions added by `central-adapter-postgres` — the first
    # workspace consumer of sqlx (url → idna → ICU4X) and rustls
    # (tls-rustls-ring). The ICU4X/unicode tree ships only Unicode-3.0
    # (OSI-approved); the rustls chain ships ISC; webpki-roots ships
    # CDLA-Permissive-2.0 (Mozilla CA bundle metadata); foldhash ships Zlib.
    # All are unavoidable transitive dependencies, scoped per-crate exactly
    # like unicode-ident above.
    { allow = ["Unicode-3.0"], crate = "icu_collections" },
    { allow = ["Unicode-3.0"], crate = "icu_locale_core" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer_data" },
    { allow = ["Unicode-3.0"], crate = "icu_properties" },
    { allow = ["Unicode-3.0"], crate = "icu_properties_data" },
    { allow = ["Unicode-3.0"], crate = "icu_provider" },
    { allow = ["Unicode-3.0"], crate = "litemap" },
    { allow = ["Unicode-3.0"], crate = "potential_utf" },
    { allow = ["Unicode-3.0"], crate = "tinystr" },
    { allow = ["Unicode-3.0"], crate = "unicode-normalization" },
    { allow = ["Unicode-3.0"], crate = "writeable" },
    { allow = ["Unicode-3.0"], crate = "yoke" },
    { allow = ["Unicode-3.0"], crate = "yoke-derive" },
    { allow = ["Unicode-3.0"], crate = "zerofrom" },
    { allow = ["Unicode-3.0"], crate = "zerofrom-derive" },
    { allow = ["Unicode-3.0"], crate = "zerotrie" },
    { allow = ["Unicode-3.0"], crate = "zerovec" },
    { allow = ["Unicode-3.0"], crate = "zerovec-derive" },
    { allow = ["ISC"], crate = "ring" },
    { allow = ["ISC"], crate = "rustls-webpki" },
    { allow = ["ISC"], crate = "untrusted" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["Zlib"], crate = "foldhash" },
]

# --- 2. Sources --------------------------------------------------------------
# crates.io only. Git dependencies are banned unless pinned to a full commit
# `rev` under an Accepted ADR (workflow §3.3); branch/tag pins never pass.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"

# --- 3. Advisories -----------------------------------------------------------
# RustSec advisory database; any advisory on a resolved version fails until
# the dependency is bumped or a recorded exception applies.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# --- 4. Bans and duplicates ---------------------------------------------------
# Unexpected duplicate versions fail; each expected duplicate is recorded in
# `skip` individually with its justification comment.
[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = [
    # Recorded duplicates introduced by `central-adapter-postgres` (the
    # first sqlx consumer): sqlx pins the digest-0.10/sha2-0.10 family while
    # the workspace pins the 0.11 generation; uuid/time pull getrandom 0.2;
    # trait-variant keeps syn 2 alongside the syn-3-pinned toolchain;
    # rustls accepts both webpki-roots generations; windows-* crates carry
    # the 0.48/0.52 pre-0.6 target ABI generations. Each skipped version is
    # the non-canonical lineage; the retained version is the workspace pin.
    { name = "block-buffer", version = "0.10.4" },
    { name = "cpufeatures", version = "0.2.17" },
    { name = "crypto-common", version = "0.1.7" },
    { name = "digest", version = "0.10.7" },
    { name = "getrandom", version = "0.2.17" },
    { name = "hashbrown", version = "0.15.5" },
    # sqlx-postgres keeps rand 0.8/rand_core 0.6 for its internal
    # channel bindings; the workspace pins the rand 0.10 generation.
    { name = "rand", version = "0.8.8" },
    { name = "rand_core", version = "0.6.4" },
    { name = "redox_syscall", version = "0.5.18" },
    { name = "sha2", version = "0.10.9" },
    { name = "syn", version = "2.0.119" },
    { name = "windows-sys", version = "0.48.0" },
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-targets", version = "0.48.5" },
    { name = "windows_aarch64_gnullvm", version = "0.48.5" },
    { name = "windows_aarch64_msvc", version = "0.48.5" },
    { name = "windows_i686_gnu", version = "0.48.5" },
    { name = "windows_i686_msvc", version = "0.48.5" },
    { name = "windows_x86_64_gnu", version = "0.48.5" },
    { name = "windows_x86_64_gnullvm", version = "0.48.5" },
    { name = "windows_x86_64_msvc", version = "0.48.5" },
]
