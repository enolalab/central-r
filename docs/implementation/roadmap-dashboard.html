const STATUS_VI = { complete: "Hoàn thành", active: "Đang làm", pending: "Chưa bắt đầu" };
const COLOR = { complete: "var(--complete)", active: "var(--active)", pending: "var(--pending)" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const fileLink = (rel, label) => `<a href="file://${esc(DATA.root)}/${esc(rel)}">${esc(label || rel.split("/").pop())}</a>`;
const fmt = (n) => n.toLocaleString("vi-VN");

function ring(pct, status, size = 70) {
  const r = size / 2 - 6, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#262c36" stroke-width="6" fill="var(--bg)"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${COLOR[status]}" stroke-width="6" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function taskState(t) {
  const d = t.steps.filter((s) => s.done).length;
  return d === t.steps.length && d > 0 ? "done" : d > 0 ? "doing" : "todo";
}

function nextStep(p) {
  if (!p.plan || p.status === "complete") return null;
  for (const t of p.plan.tasks) for (const s of t.steps) if (!s.done) return { task: t, step: s };
  return null;
}

function renderKpis() {
  const ph = DATA.phases;
  const overall = ph.reduce((a, p) => a + p.percent, 0) / ph.length;
  const active = ph.find((p) => p.status === "active");
  const done = ph.filter((p) => p.status === "complete").length;
  const loc = DATA.crates.reduce((a, c) => a + c.loc, 0);
  const impl = DATA.crates.filter((c) => !c.scaffold).length;
  const days = new Set(DATA.commits.map((c) => c.date)).size;
  const cards = [
    { l: "Tổng tiến độ", v: overall.toFixed(1) + "%", h: `<div class="bar" style="margin-top:8px"><span style="width:${overall}%"></span></div>` },
    { l: "Phase hoàn thành", v: `${done}/${ph.length}`, h: ph.filter((p) => p.status === "complete").map((p) => p.id).join(" · ") || "—" },
    { l: "Phase đang làm", v: active ? active.id : "—", h: active ? `${active.steps_done}/${active.steps_total} step · ${active.percent}%` : "" },
    { l: "Crate đã hiện thực", v: `${impl}/${DATA.crates.length}`, h: `còn ${DATA.crates.length - impl} crate placeholder` },
    { l: "Dòng Rust", v: fmt(loc), h: "src/ + tests/ của mọi crate" },
    { l: "Commit", v: fmt(DATA.commits.length), h: `trong ${days} ngày làm việc` },
  ];
  $("kpis").innerHTML = cards.map((k) => `<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="h">${k.h}</div></div>`).join("");
}

let selected = null;
function renderTimeline() {
  $("timeline").innerHTML = DATA.phases.map((p) => `
    <div class="node ${p.status} ${selected === p.id ? "sel" : ""}" data-id="${p.id}" title="${esc(p.title)}">
      <div class="ring ${p.status === "active" ? "pulse" : ""}">${ring(p.percent, p.status)}
        <div class="lbl"><div>${p.id}<small>${Math.round(p.percent)}%</small></div></div></div>
      <div class="t">${md(p.title.replace(/\s*\(.*\)\s*$/, ""))}</div>
      <span class="badge ${p.status}">${STATUS_VI[p.status] || p.status}</span>
    </div>`).join("");
  document.querySelectorAll(".node").forEach((n) => n.addEventListener("click", () => select(n.dataset.id)));
}

function select(id) {
  selected = id;
  location.hash = id;
  renderTimeline();
  const p = DATA.phases.find((x) => x.id === id);
  const nxt = nextStep(p);
  let tasksHtml = `<div class="empty">Chưa có implementation plan cho ${p.id}. Tạo plan tại <code>docs/internal/superpowers/plans/</code> với tên chứa <code>phase-${p.id.toLowerCase()}</code>.</div>`;
  if (p.plan) {
    tasksHtml = p.plan.tasks.map((t) => {
      const st = taskState(t), d = t.steps.filter((s) => s.done).length, pct = t.steps.length ? (100 * d / t.steps.length) : 0;
      const open = st === "doing" || (nxt && nxt.task === t);
      return `<details class="task ${st}" ${open ? "open" : ""}>
        <summary><span class="ic">${st === "done" ? "✓" : t.n}</span><span class="tt">${md(t.title)}</span>
          <span class="tp">${d}/${t.steps.length} step<div class="bar ${st === "doing" ? "active" : ""}"><span style="width:${pct}%"></span></div></span></summary>
        <ul class="steps">${t.steps.map((s) => `<li class="${s.done ? "ok" : nxt && nxt.step === s ? "next" : ""}">${md(s.text)}</li>`).join("")}</ul>
      </details>`;
    }).join("");
  }
  $("detail-main").innerHTML = `
    <div class="dhead"><h3>${p.id} — ${md(p.title)}</h3><span class="badge ${p.status}">${STATUS_VI[p.status]}</span></div>
    <div class="bar ${p.status === "active" ? "active" : ""}"><span style="width:${p.percent}%"></span></div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">${p.percent}% · ${p.steps_done}/${p.steps_total} step trong plan${p.plan ? " · " + fileLink(p.plan.file) : ""}</div>
    ${p.plan && p.plan.goal ? `<div class="goal" title="Bấm để mở rộng" onclick="this.classList.toggle('open')">${md(p.plan.goal)}</div>` : ""}
    <h2 style="margin-top:14px">Task trong plan</h2>${tasksHtml}`;

  const crates = p.crates.map((n) => {
    const c = DATA.crates.find((x) => x.name === n);
    const cls = c ? (c.scaffold ? "scaf" : "impl") : "scaf";
    return `<span class="chip ${cls}" title="${c ? fmt(c.loc) + " dòng" : "chưa có crate"}">${esc(n)}${c && !c.scaffold ? " · " + fmt(c.loc) : ""}</span>`;
  }).join("") || '<span class="empty">Chỉ có tài liệu</span>';
  const reviews = DATA.reviews.filter((r) => r.phase === p.id);
  $("detail-side").innerHTML = `
    ${nxt ? `<h4>Bước tiếp theo</h4><div class="next-box"><b>Task ${nxt.task.n}:</b> ${md(nxt.task.title)}<br><span style="color:var(--muted)">${md(nxt.step.text)}</span></div>` : ""}
    <h4>Tiêu chí nghiệm thu (roadmap)</h4>
    ${p.acceptance.length ? `<ul class="acc">${p.acceptance.map((a) => `<li>${md(a)}</li>`).join("")}</ul>` : '<div class="empty">—</div>'}
    <h4>Migration authority</h4><div style="font-size:13px">${md(p.migrations || "—")}</div>
    <h4>Crate sở hữu</h4><div class="chips">${crates}</div>
    <h4>Review</h4>${reviews.length ? reviews.map((r) => `<div style="font-size:13px">${esc(r.date)} · ${fileLink(r.file, r.title)}</div>`).join("") : '<div class="empty">Chưa có review report</div>'}`;
}

let crateFilter = "all";
function renderCrates() {
  const ids = ["all", ...DATA.phases.map((p) => p.id), "placeholder"];
  $("crate-filters").innerHTML = ids.map((i) => `<button class="${crateFilter === i ? "on" : ""}" data-f="${i}">${i === "all" ? "Tất cả" : i === "placeholder" ? "Placeholder" : i}</button>`).join("");
  document.querySelectorAll("#crate-filters button").forEach((b) => b.addEventListener("click", () => { crateFilter = b.dataset.f; renderCrates(); }));
  const max = Math.max(...DATA.crates.map((c) => c.loc), 1);
  const list = DATA.crates.filter((c) => crateFilter === "all" || (crateFilter === "placeholder" ? c.scaffold : c.phase === crateFilter));
  $("crates").innerHTML = list.map((c) => `<div class="crow ${c.scaffold ? "scaf" : ""}">
      <span class="n" title="${esc(c.name)}">${esc(c.name)}</span><span class="p">${c.phase || "—"}</span>
      <div class="bar"><span style="width:${Math.max(1, 100 * c.loc / max)}%"></span></div><span class="lc">${fmt(c.loc)}</span></div>`).join("") || '<div class="empty">Không có crate</div>';
}

function renderCommits() {
  const byDay = {};
  for (const c of DATA.commits) byDay[c.date] = (byDay[c.date] || 0) + 1;
  const days = Object.keys(byDay).sort();
  if (days.length) {
    const max = Math.max(...Object.values(byDay)), W = 520, H = 120, bw = Math.min(46, (W - 20) / days.length - 6);
    const bars = days.map((d, i) => {
      const h = (H - 30) * byDay[d] / max, x = 10 + i * (bw + 6);
      return `<rect x="${x}" y="${H - 18 - h}" width="${bw}" height="${h}" rx="3" fill="var(--accent)"><title>${d}: ${byDay[d]} commit</title></rect>
        <text x="${x + bw / 2}" y="${H - 20 - h - 3}" text-anchor="middle">${byDay[d]}</text>
        <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${d.slice(5)}</text>`;
    }).join("");
    $("activity").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg>`;
  }
  $("commits").innerHTML = DATA.commits.slice(0, 18).map((c) => {
    const m = c.subject.match(/^(\w+)(\(([^)]+)\))?:\s*(.*)$/);
    const type = m ? m[1] : "other", scope = m && m[3] ? m[3] : "", rest = m ? m[4] : c.subject;
    const cls = ["feat", "fix", "docs", "test", "chore"].includes(type) ? type : "other";
    return `<div class="commit"><span class="h">${esc(c.hash)}</span><span class="d">${esc(c.date)}</span>
      <span><span class="tag ${cls}">${esc(type)}${scope ? "·" + esc(scope) : ""}</span>${md(rest)}</span></div>`;
  }).join("");
}

$("sub").innerHTML = `Sinh lúc ${esc(new Date(DATA.generated).toLocaleString("vi-VN"))} từ ${fileLink("docs/implementation/rust-vertical-slice-roadmap.md")}, ${fileLink("docs/implementation/current-phase.md")} và các plan trong <code>docs/internal/superpowers/plans/</code>`;
$("foot").innerHTML = `Cập nhật: tick <code>- [x]</code> trong plan / commit, rồi chạy <code>python3 scripts/roadmap-dashboard.py</code>`;
function renderPost() {
  $("post").innerHTML = (DATA.post || []).map((sl) => {
    const done = sl.tasks.filter((t) => t.done).length;
    return `<div><b>${esc(sl.title)}</b> — ${done}/${sl.tasks.length} task · ${fileLink(sl.file)}</div>` +
      sl.tasks.map((t) => `<div style="margin:4px 0 0 12px">${t.done ? "✅" : "⏳"} LC-T${t.n} ${esc(t.title)} <span style="color:var(--muted)">${t.commits.map(esc).join(", ")}</span></div>`).join("");
  }).join("") || "—";
}
renderKpis();
renderPost();
renderCrates();
renderCommits();
const initial = location.hash.slice(1);
select(DATA.phases.some((p) => p.id === initial) ? initial : (DATA.phases.find((p) => p.status === "active") || DATA.phases[0]).id);
</script>
</body>
</html>
